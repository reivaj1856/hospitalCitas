<div class="flex items-center justify-center bg-blue-50 p-15">
  <div class="bg-white rounded-3xl shadow-2xl flex flex-col md:flex-row w-full max-w-5xl overflow-hidden">
    
    <div class="hidden md:flex flex-col justify-center bg-blue-900 w-1/2 p-12 text-white relative">
      
      
      <div class="relative">
        <img src="https://midoctorusa.com/wp-content/themes/Avada-Child-Theme/assets/images/doctor-login.jpg" 
             alt="Doctor" class="rounded-2xl shadow-xl h-full">
      </div>
      
    </div>

    <div class="w-full md:w-1/2 p-12 flex flex-col justify-center bg-white">
      <div class="mb-10">
        <h1 class="text-4xl font-bold text-blue-900 tracking-tight">COCHA</h1>
        <p class="text-gray-500 mt-2">Bienvenido de nuevo, por favor ingrese sus datos.</p>
      </div>

      <form (ngSubmit)="onLogin()" class="space-y-6">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Email o Teléfono</label>
          <input [(ngModel)]="email" name="email" type="text" 
                 class="w-full p-4 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" 
                 placeholder="Ej. juan@ejemplo.com">
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Contraseña</label>
          <input [(ngModel)]="password" name="password" type="password" 
                 class="w-full p-4 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" 
                 placeholder="••••••••">
        </div>

        <button type="submit" class="w-full bg-blue-900 text-white py-4 rounded-xl font-bold text-lg hover:bg-blue-700 transition shadow-lg shadow-blue-200">
          Iniciar Sesión
        </button>

        
      </form>
    </div>
  </div>
</div>
